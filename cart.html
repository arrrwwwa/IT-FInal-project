<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Cart</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            margin: 0;
            padding: 0;
        }

        .menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px 40px;
            display: flex;
            justify-content: right;
            gap: 40px;
            z-index: 1000;
            box-sizing: border-box;
        }

        .menu a {
            text-decoration: none;
            color: #C25A53;
            font-size: 20px;
        }

        .menu img {

            margin-top: -7px;


        }


        .menu a:hover {
            color: #905553;
        }


        .cart-body {
            max-width: 900px;
            margin: 0 auto;
            padding: 32px 20px;
        }

        .cart-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 24px;
        }

        .cart-table th {
            text-align: left;
            font-size: 12px;
            color: #999;
            font-weight: 500;
            padding: 8px 0;
            border-bottom: 1px solid #e5e5e5;
        }

        .cart-table th:nth-child(3) {
            text-align: center;
        }

        .cart-table th:last-child {
            text-align: right;
        }

        .cart-table td {
            padding: 18px 0;
            border-bottom: 1px solid #f0f0f0;
            vertical-align: middle;
        }

        .cart-table td:nth-child(3) {
            text-align: center;
        }

        .cart-table td:last-child {
            text-align: right;
        }

        .product-cell {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .product-img {
            width: 56px;
            height: 56px;
            border-radius: 6px;
            background: #f5ebe0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            flex-shrink: 0;
        }

        .product-name {
            font-size: 13px;
            color: #333;
        }

        .qty-box {
            display: inline-flex;
            align-items: center;
            border: 1px solid #ddd;
            border-radius: 4px;
            overflow: hidden;
        }

        .qty-box button {
            background: none;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 16px;
            color: #555;
            line-height: 1;
        }

        .qty-box button:hover {
            background: #f5f5f5;
        }

        .qty-box span {
            padding: 5px 12px;
            font-size: 13px;
            border-left: 1px solid #ddd;
            border-right: 1px solid #ddd;
            min-width: 36px;
            text-align: center;
        }


        .continue-btn {
            display: block;
            margin: 0 auto 28px;
            background: #9E514B;
            color: #fff;
            border: none;
            border-radius: 24px;
            padding: 11px 32px;
            font-size: 13px;
            font-family: sans-serif;
            cursor: pointer;
        }

        .continue-btn a {
            color: #fff;
            text-decoration: none;
        }

        .continue-btn:hover {
            background: #5e2323;
        }

        .bottom-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 24px;
            flex-wrap: wrap;
        }

        .coupon-area {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .coupon-input {
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 9px 14px;
            font-size: 13px;
            width: 170px;
            outline: none;
        }

        .coupon-input:focus {
            border-color: #7a3030;
        }

        .coupon-btn {
            background: #9E514B;
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 9px 16px;
            font-size: 12px;
            font-family: sans-serif;
            cursor: pointer;
        }

        .coupon-btn:hover {
            background: #5e2323;
        }

        .cart-total-box {
            border-radius: 4px;
            border: 1.5px solid #000;
            padding: 0px 15px;
            min-width: 240px;
        }

        .cart-total-box h3 {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 12px;
            color: #444;
        }

        .total-divider {
            border: none;
            border-top: 1px solid #eee;
            margin: 10px 0;
        }

        .total-row.strong {
            font-weight: 600;
            color: #222;
        }

        .checkout-btn {
            display: block;
            margin: 0 auto 28px;
            background: #9E514B;
            color: #fff;
            border: none;
            border-radius: 24px;
            padding: 11px 32px;
            font-size: 13px;
            font-family: sans-serif;
            cursor: pointer;
            margin-top: 100px;

        }

        .checkout-btn:hover {
            background: #5e2323;
        }
    </style>
</head>

<body>

    </div>
    <div class="menu">
        <a href="landingpage.html">Home</a>
        <a href="products.html">Sweets</a>
        <a href="saltyProducts.html">Savory</a>
        <a href="cart.html">Cart</a>
        <button id="theme-toggle" class="pill-button">
            <span class="icon">🌙</span> Dark Mode
        </button>
        <a>|</a>
        <img src="STUFF2.png">
    </div>
    <div>
        <img src="logo.png" style="width: 200px; height: auto;">
    </div>
    <br><br>
    <div class="cart-body">

        <p id="empty-message" style="display:none; text-align:center; color:#999;">Your cart is empty.</p>

        <div id="cart-summary">
            <table class="cart-table">
                <thead>
                    <tr>
                        <th>Product</th>
                        <th>Price</th>
                        <th>Quantity</th>
                        <th>Subtotal</th>
                    </tr>
                </thead>
                <tbody id="cart-items-list">
                </tbody>
            </table>
        </div>

        <button class="continue-btn"><a href="products.html">Continue shopping</a></button>
        <div class="bottom-row">
            <div class="coupon-area">
                <input class="coupon-input" type="text" placeholder="Coupon Code" />
                <button class="coupon-btn">Apply Coupon</button>
            </div>

            <div class="cart-total-box">
                <h3>Cart Total</h3>
                <div class="total-row"><span>Subtotal</span><span id="total-price">$0.00</span></div>
                <div class="total-row"><span>Shipping</span><span>FREE</span></div>
                <div class="total-row strong"><span>Estimated total</span><span id="total">$0.00</span></div>
                <button class="checkout-btn" onclick="checkout()">Process to checkout</button>
            </div>
        </div>
    </div>

    <script>
        const listContainer = document.getElementById('cart-items-list');
        const summary = document.getElementById('cart-summary');
        const totalElement = document.getElementById('total-price');
        const esttotal = document.getElementById('total');

        function displayCart() {
            let cartItems = JSON.parse(localStorage.getItem('myCart')) || [];

            if (cartItems.length > 0) {
                summary.style.display = 'block';
                document.getElementById('empty-message').style.display = 'none';
            } else {
                summary.style.display = 'none';
                document.getElementById('empty-message').style.display = 'block';
            }

            let htmlContent = "";
            let total = 0;

            for (let i = 0; i < cartItems.length; i++) {
                let item = cartItems[i];
                let itemTotal = parseFloat(item.price) * item.qty;

                htmlContent += `
                <tr>
                  <td>
                    <div class="product-cell">
                      <div class="product-img">
                        <img src="${item.image}" style="width: 54px; height: 54px;">
                      </div>
                      <span class="product-name">${item.name}</span>
                    </div>
                  </td>
                  <td>${item.price} EGP</td>
                  <td>
                    <div class="qty-box">
                      <span>x${item.qty}</span>
                    </div>
                  </td>
                  <td>${itemTotal.toFixed(2)} EGP
                    <br><button onclick="removeItem(${i})" style="color:red; background:none; border:none; text-decoration:underline; cursor:pointer; padding:0; font-size:11px;">Remove</button>
                  </td>
                </tr>`;

                total += itemTotal;
            }

            listContainer.innerHTML = htmlContent;
            totalElement.innerText = total.toFixed(2) + " EGP";
            esttotal.innerText = total.toFixed(2) + " EGP";

        }

        function removeItem(index) {
            let cartItems = JSON.parse(localStorage.getItem('myCart')) || [];
            cartItems.splice(index, 1);
            localStorage.setItem('myCart', JSON.stringify(cartItems));
            displayCart();
        }

        function clearCart() {
            localStorage.removeItem('myCart');
            alert("Cart cleared");
            displayCart();
        }

        function checkout() {
            alert("Order placed successfully! Thank you for choosing Golden Whisk :)");
            localStorage.removeItem('myCart');
            displayCart();
        }

        displayCart();
    </script>
    <script src="theme.js"></script>
</body>

</html>
