<!DOCTYPE html>
<html lang="en">

<head>

    <link rel="icon" type="image" href="icon.jpeg">

    <title>Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(#DFCBCB, #D7AEAC, #C15A53, #CB7D78);

        }

        .login-box {
            border: 3px solid #ccc;
            border-color: #582A1C;
            padding: 40px;
            width: 500px;
            background-color: #D5A7A5;
            border-radius: 12px;

        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #47130D;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #47130D;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 8px;
            margin-bottom: 20px;
            border: 1px solid #aaa;
            box-sizing: border-box;
            background-color: #C15A53 color:#47130D;
            border-radius: 8px
        }

        .button-wrapper {
            display: flex;
            justify-content: center;
        }

        input[type="submit"] {
            width: 50%;
            padding: 10px;
            font-size: 16px;
            cursor: pointer;
            border: 1px solid #aaa;
            border-radius: 8px
        }

        input[type="submit"]:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>
    <img src="logo.png" alt="Logo" style="width: 180px; position: fixed; top: 10px; left: 20px; z-index: 999;">

    <div class="login-box">
        <h2>Login</h2>
        <form action="landingpage.html" method="get">

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>

            <div class="button-wrapper">
                <input type="submit" value="Submit">
            </div>

        </form>
    </div>

</body>

</html>
