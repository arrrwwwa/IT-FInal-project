<!DOCTYPE html>
<html lang="en">

<head>
    <title>Sign Up</title>
    <link rel="icon" type="image/jpg" href="icon.jpeg">
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(#C15A53, #CB7D78, #D7AEAC, #DFCBCB);
        }

        .signup-box {
            border: 3px solid #582A1C;
            padding: 40px;
            width: 500px;
            background-color: #D5A7A5;
            border-radius: 12px;
            margin: 30px 0;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #47130D;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #47130D;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="tel"] {
            width: 100%;
            padding: 8px;
            margin-bottom: 20px;
            border: 1px solid #aaa;
            box-sizing: border-box;


            border-radius: 8px;
        }

        input[type="text"]::placeholder,
        input[type="email"]::placeholder,
        input[type="password"]::placeholder,
        input[type="tel"]::placeholder {
            color: #f0d0cf;
        }

        .row {
            display: flex;
            gap: 16px;
        }

        .row .field {
            flex: 1;
        }

        .password-hint {
            font-size: 12px;
            color: #6B2318;
            margin-top: -16px;
            margin-bottom: 16px;
        }

        .divider {
            border: none;
            border-top: 1px solid #A06060;
            margin: 8px 0 20px;
        }

        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 20px;
        }

        .checkbox-group input[type="checkbox"] {
            margin-top: 3px;
            accent-color: #582A1C;
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }

        .checkbox-group label {
            font-weight: normal;
            font-size: 13px;
            color: #47130D;
            margin: 0;
        }

        .checkbox-group label a {
            color: #582A1C;
            font-weight: bold;
        }

        .button-wrapper {
            display: flex;
            justify-content: center;
        }

        input[type="submit"] {
            width: 50%;
            padding: 10px;
            font-size: 16px;
            cursor: pointer;
            border: 1px solid #aaa;
            border-radius: 8px;
            background-color: #582A1C;
            color: #fff;
            font-weight: bold;
        }

        input[type="submit"]:hover {
            opacity: 0.85;
        }

        .login-link {
            text-align: center;
            margin-top: 16px;
            font-size: 13px;
            color: #47130D;
        }

        .login-link a {
            color: #582A1C;
            font-weight: bold;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <img src="logo.png" alt="Logo" style="width: 180px; position: fixed; top: 10px; left: 20px; z-index: 999;">

    <div class="signup-box">
        <h2>Create Account</h2>
        <form action=" landingpage.html" method="get">


            <div class="row">
                <div class="field">
                    <label for="first-name">First Name:</label>
                    <input type="text" id="first-name" name="first_name" placeholder="First name" required>
                </div>
                <div class="field">
                    <label for="last-name">Last Name:</label>
                    <input type="text" id="last-name" name="last_name" placeholder="Last name" required>
                </div>
            </div>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" placeholder="Enter your phone number">

            <hr class="divider">

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Create a password" required>



            <hr class="divider">

            <div class="checkbox-group">
                <input type="checkbox" id="terms" name="terms" required>
                <label for="terms">
                    I agree to the <strong>Terms of Service</strong> and <strong>Privacy Policy</strong>.
                </label>
            </div>



            <div class="button-wrapper">
                <input type="submit" value="Sign Up">
            </div>

        </form>

        <p class="login-link">Already have an account? <a href="login.html">Log in</a></p>
    </div>

</body>

</html>
